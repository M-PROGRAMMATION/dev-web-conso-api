basePath: /
definitions:
  objects.Artist:
    properties:
      creationDate:
        type: integer
      firstAlbum:
        type: string
      id:
        type: integer
      members:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  objects.Event:
    properties:
      artistId:
        type: integer
      artistName:
        type: string
      city:
        type: string
      country:
        type: string
      date:
        type: string
    type: object
  objects.Relation:
    properties:
      datesLocations:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      id:
        type: integer
    type: object
  objects.RelationIndex:
    properties:
      index:
        items:
          $ref: '#/definitions/objects.Relation'
        type: array
    type: object
  objects.Stats:
    properties:
      eventsByCity:
        additionalProperties:
          type: integer
        type: object
      totalArtists:
        type: integer
      totalEvents:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST en Go développée dans le cadre du cours Développement Web
    / Consommation d'API (YNOV).
  title: Dev Web Conso API
  version: "1.0"
paths:
  /:
    get:
      description: Affiche la liste des artistes avec une barre de recherche
      produces:
      - text/html
      responses:
        "200":
          description: page HTML
          schema:
            type: string
      summary: Page d'accueil
      tags:
      - default
  /api/events:
    get:
      parameters:
      - description: Filtre par ville
        in: query
        name: city
        type: string
      - description: Date de début (AAAA-MM-JJ)
        in: query
        name: from
        type: string
      - description: Date de fin (AAAA-MM-JJ)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/objects.Event'
            type: array
        "400":
          description: paramètre invalide
          schema:
            type: string
        "500":
          description: erreur serveur
          schema:
            type: string
      summary: Liste des concerts, triés par date et filtrables par ville / intervalle
        de dates
      tags:
      - events
  /api/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/objects.Stats'
        "500":
          description: erreur serveur
          schema:
            type: string
      summary: Statistiques globales (nombre d'artistes, de concerts, répartition
        par ville)
      tags:
      - stats
  /artist/{id}:
    get:
      description: Affiche les informations d'un artiste et la liste de ses concerts
      parameters:
      - description: ID de l'artiste
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/html
      responses:
        "200":
          description: page HTML
          schema:
            type: string
        "404":
          description: artiste introuvable
          schema:
            type: string
      summary: Page détaillée d'un artiste
      tags:
      - default
  /artists:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/objects.Artist'
            type: array
        "500":
          description: erreur serveur
          schema:
            type: string
      summary: Liste des artistes
      tags:
      - artists
  /artists/{id}:
    get:
      parameters:
      - description: ID de l'artiste
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/objects.Artist'
        "400":
          description: id invalide
          schema:
            type: string
        "404":
          description: artiste introuvable
          schema:
            type: string
        "500":
          description: erreur serveur
          schema:
            type: string
      summary: Récupère un artiste par son id
      tags:
      - artists
  /concerts:
    get:
      description: Affiche tous les concerts, triés par date, filtrables par ville
        et intervalle de dates
      parameters:
      - description: Filtre par ville
        in: query
        name: city
        type: string
      - description: Date de début (AAAA-MM-JJ)
        in: query
        name: from
        type: string
      - description: Date de fin (AAAA-MM-JJ)
        in: query
        name: to
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: page HTML
          schema:
            type: string
      summary: Liste des concerts
      tags:
      - default
  /health:
    get:
      description: Retourne l'heure de démarrage et l'uptime du serveur
      produces:
      - text/plain
      responses:
        "200":
          description: 'Health: OK'
          schema:
            type: string
      summary: Statut du serveur
      tags:
      - default
  /relation:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/objects.RelationIndex'
        "500":
          description: erreur serveur
          schema:
            type: string
      summary: Liste de toutes les relations (dates/lieux)
      tags:
      - relation
  /relation/{id}:
    get:
      parameters:
      - description: ID de la relation
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/objects.Relation'
        "400":
          description: id invalide
          schema:
            type: string
        "404":
          description: relation introuvable
          schema:
            type: string
        "500":
          description: erreur serveur
          schema:
            type: string
      summary: Récupère une relation par son id
      tags:
      - relation
swagger: "2.0"
